<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>昆虫採集AI図鑑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* カスタムスクロールバーなどを隠す */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            background-color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* 画面遷移のアニメーション用 */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms, transform 300ms;
        }
        /* 追加のアニメーション */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen overflow-hidden">

    <!-- アプリのスマホ風コンテナ -->
    <div class="w-full max-w-md h-full sm:h-[850px] sm:max-h-screen bg-[#F8F9FA] sm:rounded-3xl sm:shadow-2xl relative flex flex-col overflow-hidden border-gray-200 sm:border-8">
        
        <!-- ヘッダー（ステータスバーなどの代わり） -->
        <div class="h-6 w-full flex justify-center items-center mt-2 absolute top-0 z-50 pointer-events-none">
             <div class="w-1/3 h-1 bg-gray-300 rounded-full"></div>
        </div>

        <!-- メインコンテンツエリア (スクロール可能) -->
        <div id="content-area" class="flex-1 overflow-y-auto pb-20 pt-8 relative">
            
            <!-- 1. ホーム画面 -->
            <div id="view-home" class="view-section h-full flex flex-col relative overflow-hidden bg-gradient-to-br from-lime-100 via-green-50 to-emerald-100">
                <!-- 背景の装飾エフェクト -->
                <div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-lime-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
                <div class="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-green-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>

                <div class="p-6 flex flex-col h-full z-10">
                    <!-- ゲーミフィケーション要素（レベルと進捗） -->
                    <div class="flex justify-between items-center mb-6 bg-white/70 backdrop-blur-md p-4 rounded-2xl shadow-sm border border-white">
                        <div class="flex items-center gap-3">
                            <div class="bg-gradient-to-br from-lime-400 to-green-500 text-white font-black w-12 h-12 rounded-full flex justify-center items-center shadow-lg border-2 border-white text-xl">
                                Lv.4
                            </div>
                            <div>
                                <h1 class="text-sm font-bold text-gray-800">マスターへの道</h1>
                                <div class="w-24 h-2.5 bg-gray-200 rounded-full mt-1 overflow-hidden">
                                    <div class="bg-gradient-to-r from-lime-400 to-green-500 w-[45%] h-full rounded-full"></div>
                                </div>
                                <p class="text-[10px] text-gray-500 mt-0.5">あと120EXPでレベルアップ！</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-500 font-bold">発見数</p>
                            <p class="text-xl font-black text-green-700">4 <span class="text-sm font-medium text-gray-400">/ 150</span></p>
                        </div>
                    </div>
                    
                    <!-- 推しメンエリア（演出強化） -->
                    <div class="flex-1 flex flex-col justify-center items-center mb-4">
                        <div class="relative w-full max-w-[280px]">
                            <!-- 後光エフェクト -->
                            <div class="absolute inset-0 bg-gradient-to-tr from-lime-200 to-yellow-200 rounded-3xl animate-pulse blur-xl opacity-60"></div>
                            
                            <div class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-xl border-2 border-lime-100 w-full flex flex-col items-center justify-center relative overflow-hidden transform transition hover:scale-105">
                                <div class="absolute top-0 right-0 bg-gradient-to-r from-yellow-400 to-orange-400 text-white text-xs font-bold px-4 py-1.5 rounded-bl-2xl shadow-sm">相棒</div>
                                
                                <div class="relative mt-2">
                                    <div class="absolute inset-0 bg-lime-100 rounded-full blur-md opacity-50 animate-ping"></div>
                                    <i class="ph-duotone ph-butterfly text-8xl text-lime-600 mb-2 drop-shadow-lg relative z-10 animate-[bounce_3s_infinite]"></i>
                                </div>
                                
                                <h2 class="text-2xl font-black text-gray-800 mt-2">チョウチョウ</h2>
                                <div class="flex items-center gap-2 mt-3">
                                    <span class="bg-gradient-to-r from-blue-400 to-indigo-500 text-white text-[10px] px-3 py-1 rounded-full font-black shadow-inner">RARE</span>
                                    <span class="bg-lime-100 text-lime-800 text-[10px] px-3 py-1 rounded-full font-bold">なかよし度: ♥♥♥</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- メインアクションボタン（CTA） -->
                    <button onclick="switchView('camera')" class="mt-auto mb-2 w-full bg-gradient-to-r from-lime-500 to-green-600 hover:from-lime-400 hover:to-green-500 text-white font-black text-lg py-5 rounded-2xl shadow-[0_10px_20px_-10px_rgba(34,197,94,0.6)] transform active:translate-y-1 transition-all flex items-center justify-center gap-3 border-b-4 border-green-700">
                        <i class="ph-bold ph-scan text-2xl animate-pulse"></i>
                        <span>生き物を探しに行く！</span>
                    </button>
                </div>
            </div>

            <!-- 2. カメラ・撮影画面 -->
            <div id="view-camera" class="view-section hidden h-full flex flex-col">
                <div class="p-4 bg-white flex justify-between items-center shadow-sm z-10 relative">
                    <h1 class="text-lg font-bold text-gray-800">カメラモード</h1>
                    <button onclick="switchView('home')" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full">
                        <i class="ph ph-x text-xl"></i>
                    </button>
                </div>
                
                <!-- カメラプレビュー領域 -->
                <div class="flex-1 bg-black relative flex justify-center items-center overflow-hidden">
                    <!-- リアルタイムカメラ映像 (追加) -->
                    <video id="camera-video" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline muted></video>
                    <!-- 撮影した静止画 (追加) -->
                    <canvas id="camera-canvas" class="absolute inset-0 w-full h-full object-cover hidden z-10"></canvas>

                    <!-- ファインダーの枠 -->
                    <div class="absolute inset-4 border-2 border-white/30 rounded-lg pointer-events-none z-20">
                        <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-white/70 -mt-0.5 -ml-0.5"></div>
                        <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-white/70 -mt-0.5 -mr-0.5"></div>
                        <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-white/70 -mb-0.5 -ml-0.5"></div>
                        <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-white/70 -mb-0.5 -mr-0.5"></div>
                    </div>
                    
                    <!-- ターゲットのモック (カメラがない場合のフォールバック) -->
                    <div id="camera-target" class="text-white/20 transition-transform duration-1000 transform scale-90 z-0">
                        <i class="ph-duotone ph-butterfly text-9xl"></i>
                    </div>

                    <!-- スキャンラインアニメーション (追加) -->
                    <div id="scan-line" class="absolute left-0 w-full h-2 bg-lime-400 shadow-[0_0_15px_rgba(163,230,53,1)] hidden z-20" style="top: 0;"></div>

                    <!-- シャッターフラッシュエフェクト (追加) -->
                    <div id="shutter-flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-30"></div>

                    <!-- AI判定中オーバーレイ -->
                    <div id="loading-overlay" class="absolute inset-0 bg-black/60 hidden flex-col justify-center items-center z-40 backdrop-blur-sm">
                        <div class="relative w-20 h-20 flex justify-center items-center mb-4">
                            <div class="absolute inset-0 border-4 border-lime-500/30 border-t-lime-500 rounded-full animate-spin"></div>
                            <i class="ph-duotone ph-brain text-4xl text-lime-400 animate-pulse"></i>
                        </div>
                        <p class="text-white font-black tracking-widest text-lg">AI解析中</p>
                        <p class="text-lime-300 text-xs mt-2 font-bold">Geminiが特徴を抽出しています...</p>
                    </div>
                </div>

                <!-- コントロールパネル -->
                <div class="bg-black p-6 pb-8 flex justify-center items-center gap-8 h-40 relative z-50">
                    <button class="flex flex-col items-center text-white/70 hover:text-white" onclick="retakePhoto()">
                        <i class="ph ph-arrows-clockwise text-2xl mb-1"></i>
                        <span class="text-xs">とりなおす</span>
                    </button>
                    
                    <button onclick="startScanning()" class="w-20 h-20 bg-white rounded-full flex justify-center items-center p-1 cursor-pointer transform active:scale-95 transition">
                        <div class="w-full h-full border-2 border-black rounded-full bg-white flex justify-center items-center shadow-inner relative overflow-hidden group">
                            <div class="absolute inset-0 bg-lime-100 opacity-0 group-active:opacity-100 transition-opacity"></div>
                            <span class="font-bold text-black text-sm relative z-10">判定</span>
                        </div>
                    </button>

                    <button class="flex flex-col items-center text-white/70 hover:text-white" onclick="switchView('collection')">
                        <i class="ph ph-images text-2xl mb-1"></i>
                        <span class="text-xs">ギャラリー</span>
                    </button>
                </div>
            </div>

            <!-- 3. 発見・判定結果画面 -->
            <div id="view-result" class="view-section hidden h-full flex flex-col p-6 bg-gradient-to-b from-indigo-50 to-white">
                <div class="flex-1 flex flex-col items-center justify-center mt-10">
                    <div class="animate-bounce bg-yellow-400 text-yellow-900 font-black text-xl px-6 py-2 rounded-full mb-8 shadow-lg transform -rotate-2">
                        発見!!
                    </div>
                    
                    <div class="bg-white p-10 rounded-full shadow-2xl relative mb-8 border-4 border-indigo-100">
                        <div class="absolute -top-4 -right-4 bg-gradient-to-br from-purple-500 to-indigo-600 w-14 h-14 rounded-full flex justify-center items-center shadow-lg border-2 border-white transform rotate-12">
                            <span class="text-white font-black text-xl">R</span>
                        </div>
                        <i class="ph-duotone ph-butterfly text-8xl text-indigo-500"></i>
                    </div>

                    <h2 class="text-3xl font-black text-gray-800 mb-2">チョウチョウ</h2>
                    <p class="text-gray-500 text-sm mb-12">新しい生き物を図鑑に登録しました！</p>
                </div>

                <button onclick="switchView('collection')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-colors flex items-center justify-center gap-2 mb-4">
                    <span>TAPして次へ（図鑑へ）</span>
                    <i class="ph ph-arrow-right font-bold"></i>
                </button>
            </div>

            <!-- 4. 図鑑画面 -->
            <div id="view-collection" class="view-section hidden h-full flex flex-col">
                <div class="sticky top-0 bg-white/80 backdrop-blur-md p-4 pt-6 z-10 border-b border-gray-100">
                    <h1 class="text-2xl font-bold text-gray-800">図鑑</h1>
                    <div class="text-sm text-gray-500 mt-1">収集率: 4/150</div>
                </div>

                <div class="p-4 grid grid-cols-3 gap-3" id="pokedex-grid">
                    <!-- JavaScriptでアイテムを生成 -->
                </div>
            </div>

            <!-- 5. 詳細画面 -->
            <div id="view-detail" class="view-section hidden h-full flex flex-col bg-white">
                <div class="sticky top-0 bg-transparent p-4 z-10 flex justify-between items-center">
                    <button onclick="switchView('collection')" class="w-10 h-10 bg-white/80 backdrop-blur shadow-sm rounded-full flex justify-center items-center text-gray-800">
                        <i class="ph ph-caret-left text-xl"></i>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto -mt-14">
                    <!-- 画像エリア -->
                    <div class="h-72 bg-gradient-to-br from-indigo-100 to-purple-50 flex justify-center items-center relative">
                        <i id="detail-icon" class="ph-duotone ph-butterfly text-9xl text-indigo-500"></i>
                        <div class="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-white to-transparent"></div>
                    </div>

                    <!-- 情報エリア -->
                    <div class="p-6 relative">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 id="detail-name" class="text-3xl font-black text-gray-800">チョウチョウ</h2>
                                <p id="detail-date" class="text-sm text-gray-500 mt-1">発見日: 2026/11/17</p>
                            </div>
                            <div id="detail-rarity" class="bg-blue-100 text-blue-700 font-black px-4 py-2 rounded-xl text-lg border border-blue-200">
                                R
                            </div>
                        </div>

                        <div class="mb-6">
                            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">特徴</h3>
                            <p id="detail-desc" class="text-gray-700 leading-relaxed bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                きれいな羽を持つ昆虫。花から花へ飛び回り、花の蜜を吸う。世界中にたくさんの種類が存在する。
                            </p>
                        </div>

                        <div>
                            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">発見場所（マップ）</h3>
                            <div class="w-full h-40 bg-gray-200 rounded-2xl overflow-hidden relative border border-gray-300">
                                <!-- マップのプレースホルダー画像（ワイヤーフレームにあるマップモードを模倣） -->
                                <img src="https://placehold.co/400x200/e2e8f0/94a3b8?text=Map+Data" alt="Map" class="w-full h-full object-cover">
                                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-red-500">
                                    <i class="ph-fill ph-map-pin text-3xl drop-shadow-md"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div> <!-- /content-area -->

        <!-- ボトムナビゲーション -->
        <div class="h-16 bg-white border-t border-gray-100 flex justify-around items-center px-2 absolute bottom-0 w-full z-50 shadow-[0_-5px_15px_-10px_rgba(0,0,0,0.1)] pb-safe">
            <button onclick="switchView('camera')" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-lime-600 transition-colors" data-target="camera">
                <i class="ph ph-camera text-2xl mb-0.5"></i>
                <span class="text-[10px] font-medium">撮影</span>
            </button>
            <button onclick="switchView('home')" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-lime-600 transition-colors" data-target="home">
                <i class="ph-fill ph-house text-2xl mb-0.5"></i>
                <span class="text-[10px] font-medium">ホーム</span>
            </button>
            <button onclick="switchView('collection')" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-lime-600 transition-colors" data-target="collection">
                <i class="ph ph-book-open text-2xl mb-0.5"></i>
                <span class="text-[10px] font-medium">図鑑</span>
            </button>
            <button onclick="alert('設定画面は準備中です')" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-gray-400 hover:text-lime-600 transition-colors" data-target="settings">
                <i class="ph ph-gear text-2xl mb-0.5"></i>
                <span class="text-[10px] font-medium">設定</span>
            </button>
        </div>

    </div>

    <script>
        // ダミーデータ：図鑑の昆虫たち
        const collectionData = [
            { id: 1, name: 'チョウチョウ', rarity: 'R', icon: 'ph-butterfly', color: 'text-indigo-500', isNew: true },
            { id: 2, name: 'カブトムシ', rarity: 'SR', icon: 'ph-bug', color: 'text-amber-700', isNew: false },
            { id: 3, name: 'テントウムシ', rarity: 'N', icon: 'ph-bug-beetle', color: 'text-red-500', isNew: false },
            { id: 4, name: 'クワガタ', rarity: 'SR', icon: 'ph-bug', color: 'text-gray-800', isNew: false },
            { id: 5, name: '???', rarity: '?', icon: 'ph-question', color: 'text-gray-300', isNew: false, locked: true },
            { id: 6, name: '???', rarity: '?', icon: 'ph-question', color: 'text-gray-300', isNew: false, locked: true },
            { id: 7, name: '???', rarity: '?', icon: 'ph-question', color: 'text-gray-300', isNew: false, locked: true },
            { id: 8, name: '???', rarity: '?', icon: 'ph-question', color: 'text-gray-300', isNew: false, locked: true },
            { id: 9, name: '???', rarity: '?', icon: 'ph-question', color: 'text-gray-300', isNew: false, locked: true },
        ];

        // 初期化処理
        function initApp() {
            renderPokedex();
            
            // 少しアニメーションをつける
            setTimeout(() => {
                const target = document.getElementById('camera-target');
                if(target) target.classList.replace('scale-90', 'scale-100');
            }, 100);
        }

        // 画面切り替えロジック
        function switchView(viewName) {
            // カメラの起動・停止制御
            if (viewName === 'camera') {
                startCamera();
            } else {
                stopCamera();
                // カメラ状態のリセット
                document.getElementById('camera-canvas').classList.add('hidden');
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('scan-line').classList.add('hidden');
                document.getElementById('scan-line').style.animation = 'none';
            }

            // すべてのViewを非表示
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('fade-enter-active');
            });
            
            // 対象のViewを表示してアニメーションクラスを付与
            const targetView = document.getElementById(`view-${viewName}`);
            if (targetView) {
                targetView.classList.remove('hidden');
                targetView.classList.add('fade-enter');
                
                // 次のフレームでアクティブクラスを付けてトランジション発動
                requestAnimationFrame(() => {
                    targetView.classList.replace('fade-enter', 'fade-enter-active');
                });
            }

            // ボトムナビゲーションの状態更新
            if(viewName !== 'camera' && viewName !== 'result' && viewName !== 'detail') {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.dataset.target === viewName) {
                        btn.classList.remove('text-gray-400');
                        btn.classList.add('text-lime-600');
                        // アイコンを塗りつぶしに
                        const icon = btn.querySelector('i');
                        icon.className = icon.className.replace('ph ', 'ph-fill ');
                    } else {
                        btn.classList.remove('text-lime-600');
                        btn.classList.add('text-gray-400');
                        // アイコンをアウトラインに
                        const icon = btn.querySelector('i');
                        icon.className = icon.className.replace('ph-fill ', 'ph ');
                    }
                });
            }
            
            // 図鑑画面を開いた時はNEWバッジを消す処理など
            if (viewName === 'collection') {
                renderPokedex(); // 再描画
            }
        }

        // 図鑑のグリッドを描画
        function renderPokedex() {
            const grid = document.getElementById('pokedex-grid');
            grid.innerHTML = '';

            collectionData.forEach(item => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-3 shadow-sm border ${item.locked ? 'border-dashed border-gray-300 bg-gray-50' : 'border-gray-100 cursor-pointer active:scale-95 transition-transform'} relative flex flex-col items-center aspect-square justify-center`;
                
                if (!item.locked) {
                    card.onclick = () => showDetail(item.id);
                }

                if (item.isNew && !item.locked) {
                    card.innerHTML += `<div class="absolute -top-2 -right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full z-10 border border-white">NEW!!</div>`;
                }

                card.innerHTML += `
                    <i class="${item.locked ? 'ph' : 'ph-duotone'} ${item.icon} text-4xl ${item.color} mb-2"></i>
                    <span class="text-[10px] font-bold ${item.locked ? 'text-gray-400' : 'text-gray-700'} truncate w-full text-center">${item.name}</span>
                `;
                
                grid.appendChild(card);
            });
        }

        // 詳細画面の表示
        function showDetail(id) {
            const item = collectionData.find(i => i.id === id);
            if (!item || item.locked) return;

            document.getElementById('detail-icon').className = `ph-duotone ${item.icon} text-9xl ${item.color}`;
            document.getElementById('detail-name').innerText = item.name;
            document.getElementById('detail-rarity').innerText = item.rarity;
            
            // レア度によって色を変える
            const rarityEl = document.getElementById('detail-rarity');
            if (item.rarity === 'SR') {
                rarityEl.className = "bg-gradient-to-r from-yellow-300 to-yellow-500 text-white font-black px-4 py-2 rounded-xl text-lg shadow-md";
            } else if (item.rarity === 'R') {
                rarityEl.className = "bg-blue-100 text-blue-700 border border-blue-200 font-black px-4 py-2 rounded-xl text-lg";
            } else {
                rarityEl.className = "bg-gray-100 text-gray-600 font-black px-4 py-2 rounded-xl text-lg";
            }

            // NEWフラグを下ろす
            item.isNew = false;
            
            switchView('detail');
        }

        // カメラストリーム用変数
        let cameraStream = null;

        // カメラの起動処理
        async function startCamera() {
            const video = document.getElementById('camera-video');
            const targetMock = document.getElementById('camera-target');
            
            // 状態リセット
            video.classList.remove('hidden');
            document.getElementById('camera-canvas').classList.add('hidden');
            targetMock.classList.add('hidden');

            try {
                // 背面カメラを優先して取得
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = cameraStream;
            } catch (err) {
                console.warn("カメラへのアクセスが拒否されたか、利用できません:", err);
                // カメラが使えない場合はモックアイコンを表示
                video.classList.add('hidden');
                targetMock.classList.remove('hidden');
            }
        }

        // カメラの停止処理
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            const video = document.getElementById('camera-video');
            video.pause();
            video.srcObject = null;
        }

        // とりなおす（プレビュー再開）
        function retakePhoto() {
            document.getElementById('camera-canvas').classList.add('hidden');
            const video = document.getElementById('camera-video');
            if (cameraStream) {
                video.classList.remove('hidden');
            } else {
                document.getElementById('camera-target').classList.remove('hidden');
            }
        }

        // カメラでの判定処理（AI処理のシミュレート）
        function startScanning() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            const ctx = canvas.getContext('2d');

            // 1. シャッターエフェクト
            const flash = document.getElementById('shutter-flash');
            flash.style.transition = 'none';
            flash.style.opacity = '1';
            
            setTimeout(() => {
                flash.style.transition = 'opacity 0.4s ease-out';
                flash.style.opacity = '0';
            }, 50);

            // 2. カメラ映像がある場合はCanvasに静止画としてキャプチャ
            if (cameraStream && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                video.classList.add('hidden');
                canvas.classList.remove('hidden');
            }

            // 3. AI判定エフェクト開始
            const overlay = document.getElementById('loading-overlay');
            const scanLine = document.getElementById('scan-line');
            
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            scanLine.classList.remove('hidden');
            scanLine.style.animation = 'scan 1.5s ease-in-out infinite';

            // 約3秒後に結果画面へ（API通信のモック）
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                scanLine.classList.add('hidden');
                scanLine.style.animation = 'none';
                
                // 図鑑データを更新（チョウチョウをNEWにするなど）
                collectionData[0].isNew = true;

                switchView('result');
            }, 3000);
        }

        // 起動
        initApp();
    </script>
</body>
</html>
